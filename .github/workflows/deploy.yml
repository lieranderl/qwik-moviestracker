name: Build and deploy production to Cloud Run

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production-platform
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  PROD_SERVICE: ${{ vars.PROD_SERVICE }}
  PROD_URL: ${{ vars.PROD_URL }}

jobs:
  quality:
    name: Reuse quality gates
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  build:
    name: Build, scan, and attest image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.uri }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate production deployment inputs
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_ID_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          for name in GCP_PROJECT GCP_REGION GAR_REPOSITORY IMAGE_NAME PROD_SERVICE PROD_URL WIF_PROVIDER DEPLOYER_SERVICE_ACCOUNT; do
            [[ -n "${!name:-}" ]] || { echo "Missing required deployment variable: $name" >&2; exit 1; }
          done
          [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]
          [[ "$DEPLOYER_SERVICE_ACCOUNT" == *@"$GCP_PROJECT".iam.gserviceaccount.com ]]
          [[ "$PROD_URL" =~ ^https://[^/]+$ ]]

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud project
        run: |
          # Avoid setup-gcloud action's gcloud config set project which can fail on WIF token refresh.
          # Use CLOUDSDK_CORE_PROJECT env var to set project without triggering a token refresh.
          echo "CLOUDSDK_CORE_PROJECT=${GCP_PROJECT}" >> "$GITHUB_ENV"

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set image URI
        id: image
        run: echo "uri=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPOSITORY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate locally (single build, scan before push)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.uri }}:release-${{ github.event.release.tag_name }}
            ${{ steps.image.outputs.uri }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan candidate before pushing to registry
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.uri }}:sha-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push clean image to Artifact Registry
        id: push
        run: |
          docker push "${{ steps.image.outputs.uri }}:release-${{ github.event.release.tag_name }}"
          docker push "${{ steps.image.outputs.uri }}:sha-${{ github.sha }}"
          DIGEST=$(docker image inspect "${{ steps.image.outputs.uri }}:sha-${{ github.sha }}" --format '{{index .RepoDigests 0}}' | rev | cut -d@ -f1 | rev)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest exact image digest
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.uri }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          image: ${{ steps.image.outputs.uri }}@${{ steps.push.outputs.digest }}
          artifact-name: moviestracker-${{ github.event.release.tag_name }}.spdx.json
          output-file: sbom.spdx.json
          # Attaching a release asset needs contents: write; keep this job's
          # token read-only and retain the SBOM as a workflow artifact instead.
          upload-release-assets: false

  production:
    name: Deploy, smoke, and promote
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Authenticate production deployer
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud project
        run: |
          echo "CLOUDSDK_CORE_PROJECT=${GCP_PROJECT}" >> "$GITHUB_ENV"

      - name: Deploy, smoke-test, and promote
        env:
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          TAG: candidate-${{ github.run_id }}
          SUFFIX: candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          SERVICE_STATE=$(gcloud run services describe "$PROD_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT" --format=json)
          ACTIVE_COUNT=$(jq '[.status.traffic[] | select((.percent // 0) > 0)] | length' <<<"$SERVICE_STATE")
          ACTIVE_PERCENT=$(jq -r '[.status.traffic[] | select((.percent // 0) > 0)][0].percent' <<<"$SERVICE_STATE")
          PREVIOUS=$(jq -r '[.status.traffic[] | select((.percent // 0) > 0)][0].revisionName' <<<"$SERVICE_STATE")
          test "$ACTIVE_COUNT" = "1" && test "$ACTIVE_PERCENT" = "100"
          test -n "$PREVIOUS" && test "$PREVIOUS" != "null"

          promotion_complete=false
          rollback() {
            if [[ "$promotion_complete" != "true" ]]; then
              echo "Rolling traffic back to $PREVIOUS"
              gcloud run services update-traffic "$PROD_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT" --to-revisions="$PREVIOUS=100" --quiet || true
            fi
          }
          trap rollback EXIT
          trap 'exit 130' INT TERM

          # Deploy new revision without traffic
          gcloud run deploy "$PROD_SERVICE" \
            --image="$IMAGE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT" \
            --no-traffic \
            --tag="$TAG" \
            --revision-suffix="$SUFFIX" \
            --quiet

          # Verify the candidate revision before it receives production traffic.
          CANDIDATE_URL=$(gcloud run services describe "$PROD_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT" \
            --format=json | jq -r --arg tag "$TAG" '.status.traffic[] | select(.tag == $tag) | .url')
          test -n "$CANDIDATE_URL" && test "$CANDIDATE_URL" != "null"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --max-time 15 "$CANDIDATE_URL/healthz"

          # Promote only after candidate health passes, then run full smoke tests.
          gcloud run services update-traffic "$PROD_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT" --to-revisions="$PROD_SERVICE-$SUFFIX=100" --quiet
          ./scripts/smoke-deployment.sh "$PROD_URL"

          promotion_complete=true
          trap - EXIT INT TERM

      - name: Remove candidate tag
        if: always()
        env:
          TAG: candidate-${{ github.run_id }}
        run: gcloud run services update-traffic "$PROD_SERVICE" --region="$GCP_REGION" --project="$GCP_PROJECT" --remove-tags="$TAG" --quiet || true
